# kubectl --context dobbolab-local apply -f pod.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: gositter-bench
---
apiVersion: v1
kind: Pod
metadata:
  name: bench
  namespace: gositter-bench
spec:
  restartPolicy: Never
  nodeName: hrimfaxi
  containers:
  - name: bench
    image: golang:1.27-bookworm
    command: ["sleep", "infinity"]
    resources:
      requests: {cpu: "3", memory: 8Gi}   # node has 3.4 cpu unrequested; 14 is rejected (OutOfcpu)
      limits: {memory: 12Gi}   # no cpu limit: no CFS throttling
    securityContext:
      capabilities:
        add: ["PERFMON", "SYS_NICE"]
    volumeMounts:
    - {name: data, mountPath: /data}
    - {name: work, mountPath: /work}
  volumes:
  - {name: data, emptyDir: {}}
  - {name: work, emptyDir: {}}
